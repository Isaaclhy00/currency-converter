<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>T-Rex 4-Currency Loading Screen</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(180deg, #3a3a3a 0%, #101010 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    svg {
      width: 260px;
      height: 260px;
      overflow: visible;
    }

    /* 1. Subtle Breathing Motion */
    .dino-body {
      transform-origin: 150px 210px;
      animation: breathe 2.4s ease-in-out infinite;
    }

    /* 2. Tiny Arms Juggling Motion */
    .dino-arms {
      transform-origin: 155px 142px;
      animation: armCrank 1.2s ease-in-out infinite alternate;
    }

    /* 3. 4 Currencies Orbiting in a Smooth 3D Ring */
    .currency {
      font-size: 38px;
      font-weight: 800;
      fill: #ffffff;
      text-anchor: middle;
      dominant-baseline: central;
      animation: orbitFour 6s linear infinite;
    }

    .curr-1 { animation-delay: 0s; }     /* € */
    .curr-2 { animation-delay: -1.5s; }  /* $ */
    .curr-3 { animation-delay: -3s; }    /* ¥ */
    .curr-4 { animation-delay: -4.5s; }  /* £ */

    /* --- Keyframes --- */
    @keyframes breathe {
      0%, 100% { transform: scale(1) translateY(0px); }
      50% { transform: scale(1.018) translateY(-2px); }
    }

    @keyframes armCrank {
      0% { transform: translateY(-1.5px) rotate(-2.5deg); }
      100% { transform: translateY(1.5px) rotate(2.5deg); }
    }

    @keyframes orbitFour {
      0% {
        transform: translate(245px, 125px) scale(1);
        opacity: 1;
      }
      12.5% {
        transform: translate(217px, 143px) scale(1.1);
        opacity: 1;
      }
      25% {
        transform: translate(150px, 151px) scale(1.15);
        opacity: 1;
      }
      37.5% {
        transform: translate(83px, 143px) scale(1.1);
        opacity: 1;
      }
      50% {
        transform: translate(55px, 125px) scale(1);
        opacity: 1;
      }
      62.5% {
        transform: translate(83px, 107px) scale(0.8);
        opacity: 0.4;
      }
      75% {
        transform: translate(150px, 99px) scale(0.72);
        opacity: 0.25;
      }
      87.5% {
        transform: translate(217px, 107px) scale(0.8);
        opacity: 0.4;
      }
      100% {
        transform: translate(245px, 125px) scale(1);
        opacity: 1;
      }
    }
  </style>
</head>
<body>

  <svg viewBox="0 0 300 250" fill="none" xmlns="http://w3.org">
    
    <!-- T-Rex Body -->
    <g class="dino-body" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Main Silhouette -->
      <path d="
        M 122 106
        C 104 104, 94 88, 94 68
        C 94 42, 118 32, 152 32
        C 182 32, 195 52, 196 86
        C 197 112, 200 132, 202 152
        C 203 172, 200 192, 194 206
        C 198 214, 194 220, 184 220
        L 172 220
        C 166 220, 164 214, 164 205
        C 155 207, 146 207, 139 206
        C 139 214, 137 220, 130 220
        L 116 220
        C 108 220, 106 213, 106 204
        C 80 198, 62 184, 58 168
        C 56 162, 62 158, 68 162
        C 78 168, 92 168, 102 152
        C 108 140, 114 122, 122 106
        Z" fill="#2A2A2A" />

      <!-- Chin Under-Curve -->
      <path d="M 122 106 C 130 107, 138 107, 145 106" />

      <!-- Smile & Cheek Dimple -->
      <path d="M 98 86 C 114 93, 132 90, 142 80" />
      <path d="M 139 77 C 142 79, 144 81, 145 84" />

      <!-- Eye -->
      <circle cx="151" cy="59" r="7.5" stroke-width="4.5" fill="#2A2A2A" />
      <circle cx="153.5" cy="56.5" r="2.6" fill="#FFFFFF" stroke="none" />

      <!-- Nostril -->
      <circle cx="109" cy="58" r="2.8" fill="#181818" stroke="none" />

      <!-- Inner Left Leg Line & Belly Curve -->
      <path d="M 103 182 C 104 192, 105 198, 106 204" />
      <path d="M 164 205 C 170 202, 176 198, 181 193" />
    </g>

    <!-- Tiny Stubby Arms -->
    <g class="dino-arms" stroke="#FFFFFF" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Left Arm -->
      <path d="M 106 132 C 98 138, 102 150, 114 154 C 122 156, 128 152, 126 145 C 125 141, 120 139, 117 138" fill="#2A2A2A" />
      <!-- Right Arm -->
      <path d="M 192 124 C 204 128, 206 142, 196 150 C 188 156, 179 154, 179 147 C 179 143, 184 140, 188 138" fill="#2A2A2A" />
    </g>

    <!-- 4 Orbiting Currency Symbols -->
    <text class="currency curr-1">€</text>
    <text class="currency curr-2">$</text>
    <text class="currency curr-3">¥</text>
    <text class="currency curr-4">£</text>

  </svg>

</body>
</html>
